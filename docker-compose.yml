services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgi_backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://sgi_user:sgi_pass@postgres:5432/sgi_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_development}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-mandingasricas@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5

  ecommerce:
    build:
      context: ./ecommerce
      dockerfile: Dockerfile
    container_name: sgi_ecommerce
    ports:
      - '5174:80'
    depends_on:
      backend:
        condition: service_healthy

  pwa:
    build:
      context: ./pwa
      dockerfile: Dockerfile
    container_name: sgi_pwa
    ports:
      - '5175:80'
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: sgi_postgres
    environment:
      POSTGRES_USER: sgi_user
      POSTGRES_PASSWORD: sgi_pass
      POSTGRES_DB: sgi_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgi_user -d sgi_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgi_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
